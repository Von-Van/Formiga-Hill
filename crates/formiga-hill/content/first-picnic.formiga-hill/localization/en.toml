# The First Picnic, in English. A line is plain text, or a table with `text` and a version for any
# temperament that would say it differently. {role} becomes the name of whoever plays that role.

title = "The First Picnic"

[spread]
intro = "Someone has left a plate of warm buns on the Clubhouse table, and the rug by the fire is free."
shy = "{shy} watches from behind the big armchair."
choose_share = "Open the basket"
choose_game = "Find something to play with"

[spread.hello]
text = "{friend}! Look, a whole picnic, and nobody at it."
sweetheart = "{friend}! Come and sit with me. There's room for everyone."
grump = "Hmph. Somebody's left a picnic. Fine. We'll sit at it."
showoff = "I found it first, {friend}. Everyone saw."
lazybones = "A picnic. By the fire. This is the best day there has ever been."
scholar = "Buns with jam in, {friend}, and a cloth on the table. Somebody planned this."
troublemaker = "Finders keepers, {friend}. It's ours now."
explorer = "A picnic, indoors, {friend}! I wonder who left it."
guardian = "It's safe, {friend}. I've checked it twice."
wallflower = "{friend}... would you sit here with me?"
oddball = "A picnic with a ceiling, {friend}. The clouds will be so jealous."

[share]
intro = "{host} fetches the buns over from the table. Still warm."

[share.invite]
text = "There's plenty, {shy}. Come and have one."
grump = "Don't just stand there, {shy}. Eat something."
sweetheart = "{shy}! I saved you the biggest one."

[share.little]
text = "Is there one for me?"
troublemaker = "I want the one with the most jam."

[game]
intro = "{friend} goes to see what's in the toy box."
cheer = "{shy} cheers from behind the armchair, very quietly."

[game.after]
text = "Again! Again!"
grump = "I wasn't even trying."
showoff = "Did everyone see that?"
lazybones = "That was a lot of running."
scholar = "I think I've worked out the rules now."

[turn.ask]
text = "Can I have a turn?"
wallflower = "Um... could I have a turn, please?"
troublemaker = "My turn. My turn!"

[sunset]
intro = "Out of the window, the sun dips behind the Hill."
shared = "Not a crumb is left. Everyone is very full."
played = "Everyone is out of breath, and very happy about it."
ribbon = "{host} finds a gingham ribbon tucked under the tablecloth, and ties it in a bow to keep."

[sunset.end]
text = "Same time tomorrow, {friend}?"
grump = "I suppose we could do this again, {friend}."
sweetheart = "Thank you for today, {friend}. All of it."
lazybones = "Let's never move again, {friend}."
showoff = "Best picnic ever. Mostly because of me."
