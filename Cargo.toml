[workspace]
members = [
    "crates/formiga-hill",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Formiga contributors"]
publish = false

[workspace.dependencies]
# Formiga Desktop's shared crates, all three from the same Desktop source so their types agree.
# For now that is Desktop's hill-enablement branch, pinned to a commit by Cargo.lock; once Desktop
# releases its Hill work, switch all three to that release's tag together.
formiga-art = { git = "https://github.com/Von-Van/Formiga-Desktop", branch = "work/hill-enablement" }
formiga-core = { git = "https://github.com/Von-Van/Formiga-Desktop", branch = "work/hill-enablement" }
formiga-travel = { git = "https://github.com/Von-Van/Formiga-Desktop", branch = "work/hill-enablement" }

anyhow = "1.0.104"
directories = "5.0.1"
eframe = "0.36.2"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
toml = "1.1.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
