[workspace]
members = [
    "crates/formiga-hill",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Formiga contributors"]
publish = false

[workspace.dependencies]
# Formiga Desktop's shared crates, all three from the same Desktop source so their types agree.
# For now that is Desktop's unreleased hill-enablement branch in the local checkout; it becomes the
# GitHub repository at a release tag once Desktop publishes it. Move all three together.
formiga-art = { git = "file:///Users/jakemauldin/Documents/GitHub/Formiga%20Desktop", branch = "work/hill-enablement" }
formiga-core = { git = "file:///Users/jakemauldin/Documents/GitHub/Formiga%20Desktop", branch = "work/hill-enablement" }
formiga-travel = { git = "file:///Users/jakemauldin/Documents/GitHub/Formiga%20Desktop", branch = "work/hill-enablement" }

anyhow = "1.0.104"
eframe = "0.36.2"
png = "0.18.1"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
